[package]
name = "safescope"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Keeps AI file changes inside an approved scope and budget, and records them so they can be reviewed and undone."
readme = "plugin/README.md"
# Not "sandbox": only `safescope guard` is one, and the rest of this crate is
# careful to say it is not. A keyword that oversells it would undo that.
keywords = ["claude", "mcp", "audit", "undo", "provenance"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "safescope"
path = "src/main.rs"

# Built only with the fault-injection feature, so it never ships. Crash recovery
# cannot be tested from inside a process; this one can be killed part-way.
[[bin]]
name = "sfs-crash-harness"
path = "src/bin/crash_harness.rs"
required-features = ["fault-injection"]

[features]
default = []
fault-injection = []

[dependencies]
blake3 = "1.8.7"
cap-std = "4.0.3"
# For `follow(FollowSymlinks::No)`, which cap-std keeps behind this crate. A
# raw O_NOFOLLOW never reaches the syscall: cap-std resolves symlinks itself
# before opening, so the flag arrives after the link has already been followed.
cap-fs-ext = "4.0.3"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
libc = "0.2.189"
rmcp = { version = "3.4.0", features = ["server", "transport-io", "macros", "elicitation"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
# `net` for the guard's Unix socket: the engine has to run outside the sandbox,
# so what the host starts is a relay to it rather than a second copy of it.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync"] }
toml = "1.1.6"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

# Win32 for the three calls Windows spells differently: a handle-relative
# no-overwrite rename, an advisory lock, and the directory flush it does not have.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
