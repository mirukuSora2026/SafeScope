[package]
name = "safescope"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "safescope"
path = "src/main.rs"

# Built only with the fault-injection feature, so it never ships. Crash recovery
# cannot be tested from inside a process; this one can be killed part-way.
[[bin]]
name = "sfs-crash-harness"
path = "src/bin/crash_harness.rs"
required-features = ["fault-injection"]

[features]
default = []
fault-injection = []

[dependencies]
blake3 = "1.8.7"
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
libc = "0.2.189"
rmcp = { version = "3.4.0", features = ["server", "transport-io", "macros", "elicitation"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
toml = "1.1.6"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
