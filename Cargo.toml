[package]
name = "safescope"
version = "0.1.0"
edition = "2024"

[features]
default = []
fault-injection = []

[dependencies]
blake3 = "1.8.7"
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0.151"
